<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SharePoint Full-Width Container — Fluent UI 2 & Property Sidebar</title>
  <!-- React 17 & ReactDOM -->
  <script src="https://unpkg.com/react@17.0.2/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@17.0.2/umd/react-dom.development.js" crossorigin></script>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  
  <style>
    :root {
      --fui-colorNeutralBackground1: #ffffff;
      --fui-colorNeutralBackground2: #fafafa;
      --fui-colorNeutralBackground3: #f5f5f5;
      --fui-colorNeutralBackground4: #ebebeb;
      --fui-colorNeutralForeground1: #242424;
      --fui-colorNeutralForeground2: #424242;
      --fui-colorNeutralForeground3: #616161;
      --fui-colorNeutralStroke1: #d1d1d1;
      --fui-colorNeutralStroke2: #e0e0e0;
      --fui-colorBrandBackground: #0078d4;
      --fui-colorBrandBackgroundHover: #106ebe;
      --fui-colorBrandBackground2: #eff6fc;
      --fui-colorBrandForeground1: #0078d4;
      --fui-colorBrandForeground2: #106ebe;
      --fui-colorBrandStroke1: #0078d4;
      --fui-colorSuccessBackground1: #dff6dd;
      --fui-colorSuccessForeground1: #107c10;
      --fui-borderRadiusSmall: 4px;
      --fui-borderRadiusMedium: 6px;
      --fui-borderRadiusLarge: 8px;
      --fui-borderRadiusCircular: 9999px;
      --fui-shadow4: 0 0 2px rgba(0, 0, 0, 0.12), 0 2px 4px rgba(0, 0, 0, 0.14);
      --fui-shadow8: 0 0 2px rgba(0, 0, 0, 0.12), 0 4px 8px rgba(0, 0, 0, 0.14);
      --fui-shadow16: 0 0 2px rgba(0, 0, 0, 0.14), 0 8px 16px rgba(0, 0, 0, 0.14);
      --fui-fontFamily: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
    }

    .dark-mode {
      --fui-colorNeutralBackground1: #1f1f1f;
      --fui-colorNeutralBackground2: #141414;
      --fui-colorNeutralBackground3: #292929;
      --fui-colorNeutralBackground4: #333333;
      --fui-colorNeutralForeground1: #ffffff;
      --fui-colorNeutralForeground2: #d6d6d6;
      --fui-colorNeutralForeground3: #adadad;
      --fui-colorNeutralStroke1: #424242;
      --fui-colorNeutralStroke2: #333333;
      --fui-colorBrandBackground: #2886de;
      --fui-colorBrandBackgroundHover: #3aa0f3;
      --fui-colorBrandBackground2: #1a2733;
      --fui-colorBrandForeground1: #479ef5;
      --fui-colorBrandForeground2: #62abf5;
      --fui-colorBrandStroke1: #2886de;
      --fui-colorSuccessBackground1: #0f3b14;
      --fui-colorSuccessForeground1: #54b054;
      --fui-shadow4: 0 0 2px rgba(0, 0, 0, 0.28), 0 2px 4px rgba(0, 0, 0, 0.32);
      --fui-shadow8: 0 0 2px rgba(0, 0, 0, 0.28), 0 4px 8px rgba(0, 0, 0, 0.32);
      --fui-shadow16: 0 0 2px rgba(0, 0, 0, 0.35), 0 8px 16px rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--fui-fontFamily);
      background-color: var(--fui-colorNeutralBackground2);
      color: var(--fui-colorNeutralForeground1);
      min-height: 100vh;
      overflow-x: hidden;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    /* SharePoint Shell Top Navigation */
    .sp-header {
      background-color: var(--fui-colorNeutralBackground1);
      border-bottom: 1px solid var(--fui-colorNeutralStroke2);
      padding: 0.75rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: var(--fui-shadow4);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .sp-btn {
      background-color: var(--fui-colorBrandBackground);
      color: #fff;
      border: none;
      padding: 0.45rem 1rem;
      border-radius: var(--fui-borderRadiusMedium);
      font-family: var(--fui-fontFamily);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: opacity 0.15s ease;
    }

    .sp-btn:hover { opacity: 0.9; }

    .sp-btn-secondary {
      background-color: var(--fui-colorNeutralBackground3);
      color: var(--fui-colorNeutralForeground1);
      border: 1px solid var(--fui-colorNeutralStroke1);
    }

    /* Main Layout with Property Pane Sidebar */
    .main-workspace {
      display: flex;
      width: 100%;
      min-height: calc(100vh - 60px);
      position: relative;
    }

    .page-canvas {
      flex: 1;
      min-width: 0;
      transition: margin-right 0.25s ease;
    }

    /* Property Pane Sidebar */
    .sp-property-pane {
      width: 360px;
      background-color: var(--fui-colorNeutralBackground1);
      border-left: 1px solid var(--fui-colorNeutralStroke1);
      box-shadow: var(--fui-shadow16);
      display: flex;
      flex-direction: column;
      height: calc(100vh - 60px);
      position: sticky;
      top: 60px;
      overflow-y: auto;
      z-index: 90;
      transition: transform 0.25s ease;
    }

    .pane-header {
      padding: 1.25rem 1rem 0.75rem 1rem;
      border-bottom: 1px solid var(--fui-colorNeutralStroke2);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .pane-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--fui-colorNeutralForeground1);
    }

    .pane-desc {
      font-size: 0.8rem;
      color: var(--fui-colorNeutralForeground3);
      margin-top: 0.2rem;
    }

    .pane-nav {
      display: flex;
      border-bottom: 1px solid var(--fui-colorNeutralStroke2);
      background-color: var(--fui-colorNeutralBackground3);
    }

    .pane-nav-tab {
      flex: 1;
      padding: 0.6rem 0.5rem;
      border: none;
      background: transparent;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--fui-colorNeutralForeground2);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      text-align: center;
    }

    .pane-nav-tab.active {
      background-color: var(--fui-colorNeutralBackground1);
      color: var(--fui-colorBrandForeground1);
      border-bottom-color: var(--fui-colorBrandBackground);
    }

    .pane-body {
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .form-label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--fui-colorNeutralForeground2);
    }

    .form-input, .form-select, .form-textarea {
      background-color: var(--fui-colorNeutralBackground1);
      border: 1px solid var(--fui-colorNeutralStroke1);
      border-radius: var(--fui-borderRadiusSmall);
      padding: 0.45rem 0.6rem;
      font-family: var(--fui-fontFamily);
      font-size: 0.85rem;
      color: var(--fui-colorNeutralForeground1);
      outline: none;
    }

    .form-input:focus, .form-select:focus, .form-textarea:focus {
      border-color: var(--fui-colorBrandBackground);
    }

    .form-switch {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Container Web Part Elements */
    .fui-root {
      width: 100%;
      padding: 2rem;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      transition: background 250ms, border-color 250ms, box-shadow 250ms;
      border-radius: var(--fui-borderRadiusLarge);
    }

    .fui-root.style-standard {
      background-color: var(--fui-colorNeutralBackground2);
      border: 1px solid var(--fui-colorNeutralStroke2);
    }

    .fui-root.style-glassmorphism {
      background-color: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
    }
    body.dark-mode .fui-root.style-glassmorphism {
      background-color: rgba(24, 24, 24, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .fui-root.style-branded {
      background-color: var(--fui-colorBrandBackground2);
      border: 1px solid var(--fui-colorBrandStroke2);
    }

    .fui-root.style-minimal {
      background-color: transparent;
      border: none;
      box-shadow: none;
    }

    .fui-root.style-gradient {
      background: linear-gradient(135deg, rgba(0, 120, 212, 0.08) 0%, rgba(255, 255, 255, 0.95) 100%);
      border: 1px solid var(--fui-colorNeutralStroke2);
    }
    body.dark-mode .fui-root.style-gradient {
      background: linear-gradient(135deg, rgba(0, 120, 212, 0.15) 0%, rgba(24, 24, 24, 0.95) 100%);
    }

    .edit-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.6rem 1rem;
      background-color: var(--fui-colorBrandBackground2);
      border: 1px dashed var(--fui-colorBrandStroke1);
      border-radius: var(--fui-borderRadiusMedium);
      font-size: 0.85rem;
      gap: 1rem;
    }

    .fui-header {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      justify-content: space-between;
    }

    @media (min-width: 768px) {
      .fui-header {
        flex-direction: row;
        align-items: flex-end;
      }
    }

    .fui-title {
      font-size: 1.75rem;
      font-weight: 700;
      line-height: 2.25rem;
      color: var(--fui-colorNeutralForeground1);
    }

    .fui-subtitle {
      font-size: 0.95rem;
      color: var(--fui-colorNeutralForeground3);
      margin-top: 0.25rem;
    }

    .fui-controls {
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .fui-input-box {
      position: relative;
      display: flex;
      align-items: center;
    }

    .fui-input {
      background-color: var(--fui-colorNeutralBackground1);
      border: 1px solid var(--fui-colorNeutralStroke1);
      border-bottom: 2px solid var(--fui-colorNeutralStroke1);
      border-radius: var(--fui-borderRadiusMedium);
      padding: 0.45rem 0.75rem 0.45rem 2rem;
      color: var(--fui-colorNeutralForeground1);
      font-family: var(--fui-fontFamily);
      font-size: 0.9rem;
      outline: none;
      min-width: 220px;
    }

    .fui-input:focus { border-bottom-color: var(--fui-colorBrandBackground); }

    .fui-input-icon {
      position: absolute;
      left: 0.65rem;
      color: var(--fui-colorNeutralForeground3);
      font-size: 0.85rem;
      pointer-events: none;
    }

    .fui-mode-tabs {
      display: flex;
      background-color: var(--fui-colorNeutralBackground3);
      border-radius: var(--fui-borderRadiusMedium);
      padding: 2px;
    }

    .fui-mode-tab {
      background: transparent;
      border: none;
      padding: 0.35rem 0.75rem;
      border-radius: var(--fui-borderRadiusSmall);
      color: var(--fui-colorNeutralForeground2);
      font-family: var(--fui-fontFamily);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.15s ease;
    }

    .fui-mode-tab.active {
      background-color: var(--fui-colorNeutralBackground1);
      color: var(--fui-colorBrandForeground1);
      box-shadow: var(--fui-shadow4);
    }

    .fui-tablist {
      display: flex;
      gap: 0.5rem;
      border-bottom: 1px solid var(--fui-colorNeutralStroke2);
      padding-bottom: 0.25rem;
      overflow-x: auto;
    }

    .fui-tab {
      background: transparent;
      border: none;
      border-bottom: 3px solid transparent;
      padding: 0.6rem 1rem;
      color: var(--fui-colorNeutralForeground2);
      font-family: var(--fui-fontFamily);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .fui-tab:hover { color: var(--fui-colorNeutralForeground1); }

    .fui-tab.active {
      color: var(--fui-colorBrandForeground1);
      border-bottom-color: var(--fui-colorBrandBackground);
    }

    .fui-badge {
      background-color: var(--fui-colorBrandBackground2);
      color: var(--fui-colorBrandForeground1);
      padding: 2px 8px;
      border-radius: var(--fui-borderRadiusSmall);
      font-size: 0.75rem;
      font-weight: 600;
      white-space: nowrap;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
    }

    .fui-badge-success {
      background-color: var(--fui-colorSuccessBackground1);
      color: var(--fui-colorSuccessForeground1);
    }

    .fui-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.25rem;
      width: 100%;
    }

    .fui-card {
      background-color: var(--fui-colorNeutralBackground1);
      border: 1px solid var(--fui-colorNeutralStroke1);
      border-radius: var(--fui-borderRadiusLarge);
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: var(--fui-shadow4);
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .fui-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--fui-shadow8);
      border-color: var(--fui-colorBrandStroke1);
    }

    .fui-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.75rem;
    }

    .fui-icon-box {
      width: 36px;
      height: 36px;
      border-radius: var(--fui-borderRadiusMedium);
      background-color: var(--fui-colorBrandBackground2);
      color: var(--fui-colorBrandForeground1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
    }

    .fui-card-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--fui-colorNeutralForeground1);
      margin-bottom: 0.4rem;
    }

    .fui-card-desc {
      font-size: 0.9rem;
      color: var(--fui-colorNeutralForeground2);
      line-height: 1.45;
      margin-bottom: 1rem;
    }

    .fui-card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin-bottom: 1rem;
    }

    .fui-tag {
      background-color: var(--fui-colorNeutralBackground3);
      border: 1px solid var(--fui-colorNeutralStroke2);
      color: var(--fui-colorNeutralForeground2);
      padding: 2px 6px;
      border-radius: var(--fui-borderRadiusSmall);
      font-size: 0.75rem;
    }

    .fui-btn-subtle {
      background: transparent;
      border: none;
      color: var(--fui-colorBrandForeground1);
      font-family: var(--fui-fontFamily);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      text-decoration: none;
      padding: 0.4rem 0.6rem;
      border-radius: var(--fui-borderRadiusMedium);
      transition: background-color 0.15s ease;
      align-self: flex-start;
    }

    .fui-btn-subtle:hover {
      background-color: var(--fui-colorNeutralBackground3);
    }

    .fui-metric-value {
      font-size: 2rem;
      font-weight: 700;
      color: var(--fui-colorBrandForeground1);
      margin: 0.4rem 0 0.2rem 0;
      line-height: 2.25rem;
    }

    .fui-metric-trend {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      margin-bottom: 0.75rem;
    }

    .fui-accordion-item {
      background-color: var(--fui-colorNeutralBackground1);
      border: 1px solid var(--fui-colorNeutralStroke1);
      border-radius: var(--fui-borderRadiusMedium);
      margin-bottom: 0.5rem;
      overflow: hidden;
    }

    .fui-accordion-header {
      width: 100%;
      padding: 0.9rem 1.25rem;
      background: transparent;
      border: none;
      color: var(--fui-colorNeutralForeground1);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--fui-fontFamily);
      text-align: left;
    }

    .fui-accordion-header:hover { background-color: var(--fui-colorNeutralBackground3); }

    .fui-accordion-panel {
      padding: 1.25rem;
      border-top: 1px solid var(--fui-colorNeutralStroke2);
      background-color: var(--fui-colorNeutralBackground2);
    }
  </style>
</head>
<body>

  <!-- SharePoint Top Bar with Edit Toggle -->
  <div class="sp-header">
    <div style="display: flex; align-items: center; gap: 0.75rem;">
      <i class="fa-solid fa-shapes" style="font-size: 1.4rem; color: var(--fui-colorBrandBackground);"></i>
      <div>
        <div style="font-size: 0.95rem; font-weight: 600;">SharePoint Online — Full-width container hub</div>
        <div style="font-size: 0.75rem; color: var(--fui-colorNeutralForeground3);">Full-width section container • Microsoft Fluent UI 2</div>
      </div>
    </div>

    <div style="display: flex; gap: 0.6rem; align-items: center;">
      <button class="sp-btn sp-btn-secondary" id="btn-theme-toggle" onclick="toggleTheme()">
        <i class="fa-solid fa-circle-half-stroke"></i> Theme
      </button>
      <button class="sp-btn" id="btn-edit-toggle" onclick="toggleEditMode()">
        <i class="fa-solid fa-pen-to-square"></i> <span id="edit-mode-label">Edit page</span>
      </button>
    </div>
  </div>

  <!-- Main Container Workspace with Property Pane Sidebar -->
  <div class="main-workspace">
    <div class="page-canvas">
      <div id="spfx-root"></div>
    </div>

    <!-- Properties Sidebar Simulation -->
    <div class="sp-property-pane" id="property-pane">
      <div class="pane-header">
        <div>
          <div class="pane-title">Container properties</div>
          <div class="pane-desc">Full-width section configuration</div>
        </div>
        <button class="fui-btn-subtle" onclick="toggleSidebar()"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <!-- 3-Page Navigation -->
      <div class="pane-nav">
        <button class="pane-nav-tab active" id="tab-p1" onclick="setPanePage(1)">1. Layout</button>
        <button class="pane-nav-tab" id="tab-p2" onclick="setPanePage(2)">2. Sections</button>
        <button class="pane-nav-tab" id="tab-p3" onclick="setPanePage(3)">3. Cards (£)</button>
      </div>

      <!-- Page 1: Layout -->
      <div class="pane-body" id="pane-page-1">
        <div class="form-group">
          <label class="form-label">Container title</label>
          <input type="text" class="form-input" id="inp-title" oninput="updateTitle(this.value)" value="Container title" placeholder="Container title" />
        </div>
        <div class="form-group">
          <label class="form-label">Subtitle or description</label>
          <textarea class="form-textarea" id="inp-subtitle" rows="2" oninput="updateSubtitle(this.value)" placeholder="Container subtitle or description">Container subtitle or description</textarea>
        </div>
        <div class="form-group">
          <label class="form-label">Default layout mode</label>
          <select class="form-select" id="sel-layout" onchange="updateLayoutMode(this.value)">
            <option value="tabs">Tabbed view (pill and indicator)</option>
            <option value="accordion">Accordion view (collapsible panels)</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Container surface style</label>
          <select class="form-select" id="sel-container-style" onchange="updateContainerStyle(this.value)">
            <option value="standard">Standard Fluent 2 (solid layered surface)</option>
            <option value="glassmorphism">Acrylic glassmorphism (frosted translucent)</option>
            <option value="branded">Branded tint (inherited site palette)</option>
            <option value="minimal">Minimal (clean transparent)</option>
            <option value="gradient">Gradient ambient</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Grid columns per row</label>
          <select class="form-select" id="sel-grid-cols" onchange="updateGridCols(this.value)">
            <option value="0">Auto-fit responsive (dynamic)</option>
            <option value="1">1 column (stacked full-width)</option>
            <option value="2">2 columns (50% / 50%)</option>
            <option value="3">3 columns (33% / 33% / 33%)</option>
            <option value="4">4 columns (25% / 25% / 25% / 25%)</option>
            <option value="5">5 columns</option>
            <option value="6">6 columns</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Grid rows per container</label>
          <select class="form-select" id="sel-grid-rows" onchange="updateGridRows(this.value)">
            <option value="0">Auto or dynamic (unlimited)</option>
            <option value="1">1 row (single row)</option>
            <option value="2">2 rows</option>
            <option value="3">3 rows</option>
            <option value="4">4 rows</option>
            <option value="5">5 rows</option>
            <option value="6">6 rows</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Card height alignment</label>
          <select class="form-select" id="sel-card-height-mode" onchange="updateCardHeightMode(this.value)">
            <option value="auto">Fit content height (independent)</option>
            <option value="equal">Equal row height (match tallest)</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Quick preset template</label>
          <select class="form-select" id="sel-preset" onchange="loadPreset(this.value)">
            <option value="commercial">Commercial and financial hub (GBP £)</option>
            <option value="governance">Assurance and governance portal</option>
            <option value="starter">Blank 2-section starter</option>
          </select>
        </div>
      </div>

      <!-- Page 2: Sections & Badges -->
      <div class="pane-body" id="pane-page-2" style="display: none;">
        <div class="form-group">
          <label class="form-label">Select section to edit</label>
          <select class="form-select" id="sel-section" onchange="selectSection(this.value)"></select>
        </div>

          <label class="form-label">Section title</label>

          <select class="form-select" id="sel-sec-icon" onchange="updateSecIcon(this.value)">

            <option value="fa-sterling-sign">Financial or pound (£)</option>
            <option value="fa-shapes">Apps or tool grid</option>
            <option value="fa-shield-halved">Shield or governance</option>
            <option value="fa-circle-check">Checklist or verified</option>
            <option value="fa-chart-line">Timeline or trending metrics</option>

            <option value="Real-time">Real-time</option>

            <option value="Compliance">Compliance</option>

          <button class="sp-btn sp-btn-secondary" onclick="deleteSection()">Delete</button>

      <!-- Page 3: Cards & Financial Metrics -->
      <div class="pane-body" id="pane-page-3" style="display: none;">
        <div class="form-group">
          <label class="form-label">Target section</label>
          <select class="form-select" id="sel-card-sec" onchange="selectCardSection(this.value)"></select>
        </div>
        <div class="form-group">
          <label class="form-label">Select item to edit</label>
          <select class="form-select" id="sel-card-idx" onchange="selectCard(this.value)"></select>

        <div class="form-group">
          <label class="form-label">Item type</label>
          <select class="form-select" id="sel-card-type" onchange="updateCardType(this.value)">
            <option value="card">Standard content card</option>
            <option value="metric">British metric stat (£)</option>
            <option value="embed">Embedded tool or portal</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Item icon</label>
          <select class="form-select" id="sel-card-icon" onchange="updateCardIcon(this.value)">
            <option value="fa-file-lines">Book or documentation</option>
            <option value="fa-sterling-sign">Financial or pound (£)</option>
            <option value="fa-shapes">Apps or tool grid</option>
            <option value="fa-shield-halved">Shield or governance</option>
            <option value="fa-circle-check">Checklist or verified</option>
            <option value="fa-chart-line">Timeline or trending metrics</option>
            <option value="fa-wrench">Calculator or engineering</option>
            <option value="fa-lock">Lock or security</option>
            <option value="fa-globe">Globe or portal</option>

        </div>
        <div class="form-group">
          <label class="form-label">Card height behavior</label>
          <select class="form-select" id="sel-card-item-height-mode" onchange="updateCardItemHeightMode(this.value)">
            <option value="default">Inherit container setting</option>
            <option value="auto">Fit content height (independent)</option>
            <option value="equal">Equal row height (match tallest)</option>
          </select>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem;">
          <div class="form-group">
            <label class="form-label" id="lbl-card-colspan">Column span</label>
            <select class="form-select" id="sel-card-colspan" onchange="updateCardColSpan(this.value)"></select>

          <div class="form-group">
            <label class="form-label" id="lbl-card-rowspan">Row span</label>
            <select class="form-select" id="sel-card-rowspan" onchange="updateCardRowSpan(this.value)"></select>

          <label class="form-label">Metric trend</label>

        <div class="form-group">
          <label class="form-label">Card summary or description</label>
          <textarea class="form-textarea" id="inp-card-desc" rows="2" oninput="updateCardDesc(this.value)" placeholder="Card summary"></textarea>
        </div>

        <!-- Real-time Live Data API Group (Matching Screenshot 1) -->
        <div class="form-group">
          <label class="form-label">Real-time live data API (optional)</label>

            <input type="text" class="form-input" id="inp-card-live-api" placeholder="API endpoint URL (e.g. https://... or demo-api/burnDown)" oninput="updateCardLiveApi(this.value)" />
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
              <input type="text" class="form-input" id="inp-card-live-path" placeholder="JSON path (e.g. data.metric)" oninput="updateCardLivePath(this.value)" />
              <input type="text" class="form-input" id="inp-card-live-prefix" placeholder="Prefix (e.g. £)" oninput="updateCardLivePrefix(this.value)" />

        <!-- Global Term Store Selector (Matching Screenshot 2 - Intranet Our Sectors / Our Segments) -->
        <div class="form-group">
          <label class="form-label">Global term store • Intranet term sets</label>
          <div style="background: var(--fui-colorNeutralBackground2); border: 1px solid var(--fui-colorNeutralStroke2); border-radius: 6px; padding: 10px; display: flex; flex-direction: column; gap: 8px;">
            <div style="display: flex; gap: 4px; flex-wrap: wrap;">
              <button type="button" class="fui-badge" style="cursor: pointer; border: 1px solid var(--fui-colorBrandStroke1); background: var(--fui-colorBrandBackground2);" onclick="filterTermStoreCategory('all')">All terms</button>
              <button type="button" class="fui-badge" style="cursor: pointer;" onclick="filterTermStoreCategory('Our Sectors')">🏢 Our Sectors</button>
              <button type="button" class="fui-badge" style="cursor: pointer;" onclick="filterTermStoreCategory('Our Segments')">📊 Our Segments</button>
            </div>
            <div id="term-store-chips" style="display: flex; flex-wrap: wrap; gap: 6px; max-height: 120px; overflow-y: auto;">
              <!-- Dynamic chips rendered via JS -->
            </div>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Badge label</label>
          <input type="text" class="form-input" id="inp-card-badge" placeholder="Badge" oninput="updateCardBadge(this.value)" />
        </div>
        <div style="display: flex; gap: 0.5rem; margin-top: 0.5rem;">
          <button class="sp-btn" style="flex: 1;" onclick="addCard()">+ Add card</button>
          <button class="sp-btn sp-btn-secondary" onclick="deleteCard()">Delete</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let isEditMode = true;
    let isSidebarOpen = true;
    let currentSections = [
      {
        id: 'sec-1',
        title: 'Section title 1',
        iconName: 'fa-book-open',
        badge: 'Badge',
        description: 'Section summary 1',
        blocks: [
          {
            id: 'blk-1',
            type: 'card',
            title: 'Card title 1',
            description: 'Card summary 1',
            badge: 'Badge',
            iconName: 'fa-file-lines',
            tags: ['Tag 1', 'Tag 2'],
            actionText: 'Action link',
            actionUrl: '#'
          },
          {
            id: 'blk-2',
            type: 'metric',
            title: 'Metric title 1',
            description: 'Metric summary 1',
            metricValue: '£1,420,000',
            metricTrend: '+6.2% vs baseline',
            tags: ['Tag 3', 'Tag 4']
          },
          {
            id: 'blk-3',
            type: 'card',
            title: 'Card title 2',
            description: 'Card summary 2',
            badge: 'Badge',
            iconName: 'fa-circle-check',
            tags: ['Tag 5'],
            actionText: 'Action link',
            actionUrl: '#'
          }
        ]
      },
      {
        id: 'sec-2',
        title: 'Section title 2',
        iconName: 'fa-chart-simple',
        badge: 'Real-time',
        description: 'Section summary 2',
        blocks: [
          {
            id: 'blk-m1',
            type: 'metric',
            title: 'Metric title 1',
            metricValue: '£42,850,000',
            metricTrend: '+3.2% vs Q2 forecast',
            description: 'Metric summary 1',
            tags: ['Tag 1', 'Tag 2']
          },
          {
            id: 'blk-m2',
            type: 'metric',
            title: 'Metric title 2',
            metricValue: '£3,420,000',
            metricTrend: '+18.4% ahead of target',
            description: 'Metric summary 2',
            tags: ['Tag 3', 'Tag 4']
          },
          {
            id: 'blk-m3',
            type: 'metric',
            title: 'Metric title 3',
            metricValue: '94.8%',
            metricTrend: '+1.5% from last period',
            description: 'Metric summary 3',
            tags: ['Tag 5']
          }
        ]
      },
      {
        id: 'sec-3',
        title: 'Section title 3',
        iconName: 'fa-window-restore',
        badge: 'Interactive',
        description: 'Section summary 3',
        blocks: [
          {
            id: 'blk-e1',
            type: 'card',
            title: 'Card title 1',
            description: 'Card summary 1',
            badge: 'Badge',
            iconName: 'fa-wrench',
            tags: ['Tag 1', 'Tag 2'],
            actionText: 'Action link',
            actionUrl: '#'
          },
          {
            id: 'blk-e2',
            type: 'card',
            title: 'Card title 2',
            description: 'Card summary 2',
            badge: 'Badge',
            iconName: 'fa-globe',
            tags: ['Tag 3', 'Tag 4'],
            actionText: 'Action link',
            actionUrl: '#'
          }
        ]
      }
    ];

    let state = {
      title: 'Container title',
      subtitle: 'Container subtitle or description',
      layoutMode: 'tabs',
      containerStyle: 'standard',
      gridCols: 0,
      gridRows: 0,
      cardHeightMode: 'auto',
      activeTabId: 'sec-1',
      searchQuery: '',
      activeSecIdx: 0,
      activeCardSecIdx: 0,
      activeCardIdx: 0
    };

    function toggleTheme() {
      document.body.classList.toggle('dark-mode');
    }

    function toggleEditMode() {
      isEditMode = !isEditMode;
      document.getElementById('edit-mode-label').textContent = isEditMode ? 'Exit Edit' : 'Edit Page';
      document.getElementById('property-pane').style.display = isEditMode ? 'flex' : 'none';
      render();
    }

    function toggleSidebar() {
      isSidebarOpen = !isSidebarOpen;
      document.getElementById('property-pane').style.display = isSidebarOpen ? 'flex' : 'none';
    }

    function setPanePage(page) {
      document.getElementById('pane-page-1').style.display = page === 1 ? 'flex' : 'none';
      document.getElementById('pane-page-2').style.display = page === 2 ? 'flex' : 'none';
      document.getElementById('pane-page-3').style.display = page === 3 ? 'flex' : 'none';
      document.getElementById('tab-p1').classList.toggle('active', page === 1);
      document.getElementById('tab-p2').classList.toggle('active', page === 2);
      document.getElementById('tab-p3').classList.toggle('active', page === 3);
      syncSidebar();
    }

    function updateTitle(val) { state.title = val; render(); }
    function updateSubtitle(val) { state.subtitle = val; render(); }
    function updateLayoutMode(val) { state.layoutMode = val; render(); }
    function updateContainerStyle(val) { state.containerStyle = val; render(); }
    function updateGridCols(val) { state.gridCols = Number(val); render(); syncSidebar(); }
    function updateGridRows(val) { state.gridRows = Number(val); render(); syncSidebar(); }
    function updateCardHeightMode(val) { state.cardHeightMode = val; render(); }

    function syncSidebar() {
      // Sync Section Dropdown
      const selSec = document.getElementById('sel-section');
      selSec.innerHTML = '';
      currentSections.forEach((s, idx) => {
        const opt = document.createElement('option');
        opt.value = idx;
        opt.textContent = `${idx + 1}. ${s.title} (${s.badge || 'Section'})`;
        selSec.appendChild(opt);
      });
      selSec.value = state.activeSecIdx;

      const curSec = currentSections[state.activeSecIdx] || currentSections[0];
      if (curSec) {
        document.getElementById('inp-sec-title').value = curSec.title || '';
        document.getElementById('sel-sec-icon').value = curSec.iconName || 'fa-book-open';
        document.getElementById('sel-sec-badge').value = curSec.badge || 'Badge';
        document.getElementById('inp-sec-desc').value = curSec.description || '';
      }

      // Sync Card Target Section & Cards
      const selCardSec = document.getElementById('sel-card-sec');
      selCardSec.innerHTML = '';
      currentSections.forEach((s, idx) => {
        const opt = document.createElement('option');
        opt.value = idx;
        opt.textContent = `${idx + 1}. ${s.title}`;
        selCardSec.appendChild(opt);
      });
      selCardSec.value = state.activeCardSecIdx;

      const targetSec = currentSections[state.activeCardSecIdx];
      const selCard = document.getElementById('sel-card-idx');
      if (selCard) {
        selCard.innerHTML = '';
        if (targetSec && targetSec.blocks.length > 0) {
          targetSec.blocks.forEach((b, idx) => {
            const opt = document.createElement('option');
            opt.value = idx;
            opt.textContent = `${idx + 1}. ${b.title} [${b.type}]`;
            selCard.appendChild(opt);
          });
          selCard.value = state.activeCardIdx;
          const curCard = targetSec.blocks[state.activeCardIdx] || targetSec.blocks[0];
          if (curCard) {
            // Dynamic Column Span Options based on Container Grid Columns
            const effectiveMaxCols = Math.max(1, state.gridCols > 0 ? state.gridCols : 4);
            const effectiveMaxRows = Math.max(1, state.gridRows > 0 ? state.gridRows : 5);

            const selColSpan = document.getElementById('sel-card-colspan');
            const lblColSpan = document.getElementById('lbl-card-colspan');
            if (selColSpan) {
              selColSpan.innerHTML = '';
              for (let c = 1; c <= effectiveMaxCols; c++) {
                const opt = document.createElement('option');
                opt.value = c;
                opt.textContent = c === 1 ? '1 col (standard)' : (c === effectiveMaxCols ? `Span ${c} cols (full)` : `Span ${c} cols`);
                selColSpan.appendChild(opt);
              }
              const clampedCol = Math.min(curCard.colSpan || 1, effectiveMaxCols);
              curCard.colSpan = clampedCol;
              selColSpan.value = clampedCol;
            }
            if (lblColSpan) {
              lblColSpan.textContent = `Column span (max ${effectiveMaxCols})`;
            }

            // Dynamic Row Span Options based on Container Grid Rows
            const selRowSpan = document.getElementById('sel-card-rowspan');
            const lblRowSpan = document.getElementById('lbl-card-rowspan');
            if (selRowSpan) {
              selRowSpan.innerHTML = '';
              for (let r = 1; r <= effectiveMaxRows; r++) {
                const opt = document.createElement('option');
                opt.value = r;
                opt.textContent = r === 1 ? '1 row (standard)' : `Span ${r} rows`;
                selRowSpan.appendChild(opt);
              }
              const clampedRow = Math.min(curCard.rowSpan || 1, effectiveMaxRows);
              curCard.rowSpan = clampedRow;
              selRowSpan.value = clampedRow;
            }
            if (lblRowSpan) {
              lblRowSpan.textContent = `Row span (max ${effectiveMaxRows})`;
            }

            const setVal = (id, v) => { const el = document.getElementById(id); if (el) el.value = v; };
            setVal('sel-card-type', curCard.type || 'card');
            setVal('sel-card-icon', curCard.iconName || 'fa-file-lines');
            setVal('sel-card-item-height-mode', curCard.heightMode || 'default');
            setVal('inp-card-title', curCard.title || '');
            setVal('inp-card-desc', curCard.description || '');
            setVal('inp-card-badge', curCard.badge || '');
            setVal('inp-card-metric-val', curCard.metricValue || '');
            setVal('inp-card-metric-trend', curCard.metricTrend || '');
            setVal('inp-card-live-api', curCard.liveDataConfig?.apiUrl || '');
            setVal('inp-card-live-path', curCard.liveDataConfig?.jsonPath || '');
            setVal('inp-card-live-prefix', curCard.liveDataConfig?.prefix || '');

            const isMetric = curCard.type === 'metric';
            const grpMetric = document.getElementById('grp-card-metric');
            const grpTrend = document.getElementById('grp-card-trend');
            if (grpMetric) grpMetric.style.display = isMetric ? 'flex' : 'none';
            if (grpTrend) grpTrend.style.display = isMetric ? 'flex' : 'none';

            renderTermStoreChips();
          }
        }
      }
    }

    const intranetTerms = [
      { id: 'sec-infra', label: 'Infrastructure', termSetName: 'Our Sectors' },
      { id: 'sec-energy', label: 'Energy and utilities', termSetName: 'Our Sectors' },
      { id: 'sec-prop', label: 'Real estate and property', termSetName: 'Our Sectors' },
      { id: 'sec-def', label: 'Defence and security', termSetName: 'Our Sectors' },
      { id: 'sec-av', label: 'Aviation and transport', termSetName: 'Our Sectors' },
      { id: 'sec-health', label: 'Healthcare and science', termSetName: 'Our Sectors' },
      { id: 'sec-gov', label: 'Government and public sector', termSetName: 'Our Sectors' },
      { id: 'sec-tech', label: 'Technology and digital', termSetName: 'Our Sectors' },
      { id: 'seg-comm', label: 'Commercial advisory', termSetName: 'Our Segments' },
      { id: 'seg-prog', label: 'Programme management', termSetName: 'Our Segments' },
      { id: 'seg-proj', label: 'Project controls', termSetName: 'Our Segments' },
      { id: 'seg-cost', label: 'Cost and commercial management', termSetName: 'Our Segments' },
      { id: 'seg-strat', label: 'Strategic advisory', termSetName: 'Our Segments' },
      { id: 'seg-esg', label: 'Sustainability, ESG and net zero', termSetName: 'Our Segments' },
      { id: 'seg-proc', label: 'Procurement and supply chain', termSetName: 'Our Segments' },
      { id: 'seg-disp', label: 'Dispute resolution', termSetName: 'Our Segments' }
    ];

    let activeTermCategory = 'all';

    function filterTermStoreCategory(cat) {
      activeTermCategory = cat;
      renderTermStoreChips();
    }

    function renderTermStoreChips() {
      const container = document.getElementById('term-store-chips');
      if (!container) return;
      container.innerHTML = '';
      const targetSec = currentSections[state.activeCardSecIdx];
      const curCard = targetSec && targetSec.blocks ? targetSec.blocks[state.activeCardIdx] : null;
      const selectedTags = curCard && curCard.termStoreTags ? curCard.termStoreTags : [];

      const filtered = intranetTerms.filter(t => activeTermCategory === 'all' || t.termSetName.toLowerCase() === activeTermCategory.toLowerCase());

      filtered.forEach(term => {
        const isSelected = selectedTags.some(st => st.id === term.id || st.label.toLowerCase() === term.label.toLowerCase());
        const chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'fui-tag';
        chip.style.cursor = 'pointer';
        chip.style.backgroundColor = isSelected ? 'var(--fui-colorBrandBackground2)' : 'var(--fui-colorNeutralBackground1)';
        chip.style.borderColor = isSelected ? 'var(--fui-colorBrandStroke1)' : 'var(--fui-colorNeutralStroke1)';
        chip.style.color = isSelected ? 'var(--fui-colorBrandForeground1)' : 'var(--fui-colorNeutralForeground1)';
        chip.innerHTML = `${isSelected ? '✓ ' : '+ '}${term.label} <small style="opacity: 0.7;">[${term.termSetName}]</small>`;
        chip.onclick = () => toggleCardTerm(term);
        container.appendChild(chip);
      });
    }

    function toggleCardTerm(term) {
      const targetSec = currentSections[state.activeCardSecIdx];
      if (!targetSec || !targetSec.blocks[state.activeCardIdx]) return;
      const curCard = targetSec.blocks[state.activeCardIdx];
      if (!curCard.termStoreTags) curCard.termStoreTags = [];
      const idx = curCard.termStoreTags.findIndex(t => t.id === term.id || t.label.toLowerCase() === term.label.toLowerCase());
      if (idx >= 0) {
        curCard.termStoreTags.splice(idx, 1);
      } else {
        curCard.termStoreTags.push(term);
      }
      renderTermStoreChips();
      render();
    }

    function updateCardLiveApi(val) {
      const targetSec = currentSections[state.activeCardSecIdx];
      if (targetSec && targetSec.blocks[state.activeCardIdx]) {
        const curCard = targetSec.blocks[state.activeCardIdx];
        if (!curCard.liveDataConfig) curCard.liveDataConfig = { apiUrl: '', jsonPath: 'value', prefix: '£' };
        curCard.liveDataConfig.apiUrl = val;
        render();
      }
    }

    function updateCardLivePath(val) {
      const targetSec = currentSections[state.activeCardSecIdx];
      if (targetSec && targetSec.blocks[state.activeCardIdx]) {
        const curCard = targetSec.blocks[state.activeCardIdx];
        if (!curCard.liveDataConfig) curCard.liveDataConfig = { apiUrl: '', jsonPath: 'value', prefix: '£' };
        curCard.liveDataConfig.jsonPath = val;
        render();
      }
    }

    function updateCardLivePrefix(val) {
      const targetSec = currentSections[state.activeCardSecIdx];
      if (targetSec && targetSec.blocks[state.activeCardIdx]) {
        const curCard = targetSec.blocks[state.activeCardIdx];
        if (!curCard.liveDataConfig) curCard.liveDataConfig = { apiUrl: '', jsonPath: 'value', prefix: '£' };
        curCard.liveDataConfig.prefix = val;
        render();
      }
    }

    function selectSection(idx) { state.activeSecIdx = Number(idx); syncSidebar(); }
    function updateSecTitle(val) { if (currentSections[state.activeSecIdx]) currentSections[state.activeSecIdx].title = val; render(); }
    function updateSecIcon(val) { if (currentSections[state.activeSecIdx]) currentSections[state.activeSecIdx].iconName = val; render(); }
    function updateSecBadge(val) { if (currentSections[state.activeSecIdx]) currentSections[state.activeSecIdx].badge = val; render(); }
    function updateSecDesc(val) { if (currentSections[state.activeSecIdx]) currentSections[state.activeSecIdx].description = val; render(); }

    function updateCardIcon(val) {
      const targetSec = currentSections[state.activeCardSecIdx];
      if (targetSec && targetSec.blocks[state.activeCardIdx]) {
        targetSec.blocks[state.activeCardIdx].iconName = val;
        render();
      }
    }

    function addSection() {
      const newSecIdx = currentSections.length + 1;
      const newSec = {
        id: 'sec-' + Date.now(),
        title: `Section title ${newSecIdx}`,
        iconName: 'fa-book-open',
        badge: 'Badge',
        description: `Section summary ${newSecIdx}`,
        blocks: [
          {
            id: 'blk-' + Date.now(),
            type: 'card',
            title: 'Card title',
            description: 'Card summary',
            badge: 'Badge',
            iconName: 'fa-file-lines',
            actionText: 'Action link',
            actionUrl: '#',
            tags: ['Tag 1']
          }
        ]
      };
      currentSections.push(newSec);
      state.activeSecIdx = currentSections.length - 1;
      state.activeTabId = newSec.id;
      syncSidebar();
      render();
    }

    function deleteSection() {
      if (currentSections.length <= 1) return;
      currentSections.splice(state.activeSecIdx, 1);
      state.activeSecIdx = Math.max(0, state.activeSecIdx - 1);
      state.activeTabId = currentSections[0].id;
      syncSidebar();
      render();
    }

    function selectCardSection(idx) {
      state.activeCardSecIdx = Number(idx);
      state.activeCardIdx = 0;
      syncSidebar();
    }

    function selectCard(idx) {
      state.activeCardIdx = Number(idx);
      syncSidebar();
    }

    function updateCardType(val) {
      const targetSec = currentSections[state.activeCardSecIdx];
      if (targetSec && targetSec.blocks[state.activeCardIdx]) {
        targetSec.blocks[state.activeCardIdx].type = val;
        syncSidebar();
        render();
      }
    }

    function updateCardColSpan(val) {
      const targetSec = currentSections[state.activeCardSecIdx];
      if (targetSec && targetSec.blocks[state.activeCardIdx]) {
        targetSec.blocks[state.activeCardIdx].colSpan = Number(val) || 1;
        render();
      }
    }

    function updateCardRowSpan(val) {
      const targetSec = currentSections[state.activeCardSecIdx];
      if (targetSec && targetSec.blocks[state.activeCardIdx]) {
        targetSec.blocks[state.activeCardIdx].rowSpan = Number(val) || 1;
        render();
      }
    }

    function updateCardTitle(val) {
      const targetSec = currentSections[state.activeCardSecIdx];
      if (targetSec && targetSec.blocks[state.activeCardIdx]) {
        targetSec.blocks[state.activeCardIdx].title = val;
        render();
      }
    }

    function updateCardMetricVal(val) {
      const targetSec = currentSections[state.activeCardSecIdx];
      if (targetSec && targetSec.blocks[state.activeCardIdx]) {
        targetSec.blocks[state.activeCardIdx].metricValue = val;
        render();
      }
    }

    function updateCardMetricTrend(val) {
      const targetSec = currentSections[state.activeCardSecIdx];
      if (targetSec && targetSec.blocks[state.activeCardIdx]) {
        targetSec.blocks[state.activeCardIdx].metricTrend = val;
        render();
      }
    }

    function updateCardDesc(val) {
      const targetSec = currentSections[state.activeCardSecIdx];
      if (targetSec && targetSec.blocks[state.activeCardIdx]) {
        targetSec.blocks[state.activeCardIdx].description = val;
        render();
      }
    }

    function updateCardBadge(val) {
      const targetSec = currentSections[state.activeCardSecIdx];
      if (targetSec && targetSec.blocks[state.activeCardIdx]) {
        targetSec.blocks[state.activeCardIdx].badge = val;
        render();
      }
    }

    function updateCardTermTags(val) {
      const targetSec = currentSections[state.activeCardSecIdx];
      if (targetSec && targetSec.blocks[state.activeCardIdx]) {
        const split = val.split(',').map(s => s.trim()).filter(Boolean);
        targetSec.blocks[state.activeCardIdx].termStoreTags = split.map((s, i) => ({ id: 't-' + i, label: s }));
        render();
      }
    }

    function addCard() {
      const targetSec = currentSections[state.activeCardSecIdx];
      if (!targetSec) return;
      const newCard = {
        id: 'blk-' + Date.now(),
        type: 'card',
        title: 'Card title',
        description: 'Card description summary',
        badge: 'Badge',
        actionText: 'Learn more',
        actionUrl: '#',
        colSpan: 1,
        rowSpan: 1
      };
      targetSec.blocks.push(newCard);
      state.activeCardIdx = targetSec.blocks.length - 1;
      syncSidebar();
      render();
    }

    function deleteCard() {
      const targetSec = currentSections[state.activeCardSecIdx];
      if (!targetSec || targetSec.blocks.length <= 1) return;
      targetSec.blocks.splice(state.activeCardIdx, 1);
      state.activeCardIdx = Math.max(0, state.activeCardIdx - 1);
      syncSidebar();
      render();
    }

    function App() {
      const activeSection = currentSections.find(s => s.id === state.activeTabId) || currentSections[0];

      const filterBlocks = (blocks) => {
        if (!state.searchQuery.trim()) return blocks;
        const q = state.searchQuery.toLowerCase().trim();
        return blocks.filter(b => 
          b.title.toLowerCase().includes(q) ||
          (b.description && b.description.toLowerCase().includes(q)) ||
          (b.badge && b.badge.toLowerCase().includes(q)) ||
          (b.tags && b.tags.some(t => t.toLowerCase().includes(q)))
        );
      };

      const gridInlineStyle = {
        gridTemplateColumns: state.gridCols > 0 ? `repeat(${state.gridCols}, 1fr)` : 'repeat(auto-fill, minmax(320px, 1fr))'
      };

      return React.createElement('div', { className: 'fui-root style-' + (state.containerStyle || 'standard') },
        // Edit Mode Banner
        isEditMode ? React.createElement('div', { className: 'edit-banner' },
          React.createElement('div', { style: { display: 'flex', alignItems: 'center', gap: '0.5rem' } },
            React.createElement('span', { className: 'fui-badge', style: { backgroundColor: 'var(--fui-colorBrandBackground)', color: '#fff' } }, 'SharePoint Edit Mode'),
            React.createElement('span', null, 'Click text to edit, hover between items to insert new content (+), or click ✏️ to customize card properties and grid span.')
          ),
          React.createElement('button', {
            className: 'fui-btn-subtle',
            style: { border: '1px solid var(--fui-colorBrandStroke1)', padding: '0.3rem 0.6rem' },
            onClick: () => { document.getElementById('property-pane').style.display = 'flex'; }
          }, React.createElement('i', { className: 'fa-solid fa-sliders' }), ' Open Sidebar')
        ) : null,

        // Header
        React.createElement('div', { className: 'fui-header' },
          React.createElement('div', null,
            React.createElement('h1', { className: 'fui-title' }, state.title),
            React.createElement('p', { className: 'fui-subtitle' }, state.subtitle)
          ),
          React.createElement('div', { className: 'fui-controls' },
            // Search Box
            React.createElement('div', { className: 'fui-input-box' },
              React.createElement('i', { className: 'fa-solid fa-magnifying-glass fui-input-icon' }),
              React.createElement('input', {
                type: 'text',
                className: 'fui-input',
                placeholder: 'Filter items, tags, GBP...',
                value: state.searchQuery,
                onChange: (e) => { state.searchQuery = e.target.value; render(); }
              })
            ),
            // Layout Switcher
            React.createElement('div', { className: 'fui-mode-tabs' },
              React.createElement('button', {
                className: 'fui-mode-tab ' + (state.layoutMode === 'tabs' ? 'active' : ''),
                onClick: () => { state.layoutMode = 'tabs'; render(); }
              }, React.createElement('i', { className: 'fa-solid fa-folder' }), 'Tabs'),
              React.createElement('button', {
                className: 'fui-mode-tab ' + (state.layoutMode === 'accordion' ? 'active' : ''),
                onClick: () => { state.layoutMode = 'accordion'; render(); }
              }, React.createElement('i', { className: 'fa-solid fa-list' }), 'Accordion')
            )
          )
        ),

        // Tabs View
        state.layoutMode === 'tabs' ? React.createElement('div', null,
          React.createElement('div', { className: 'fui-tablist' },
            currentSections.map(sec => 
              React.createElement('button', {
                key: sec.id,
                className: 'fui-tab ' + (sec.id === state.activeTabId ? 'active' : ''),
                onClick: () => { state.activeTabId = sec.id; render(); }
              },
                React.createElement('i', { className: 'fa-solid ' + (sec.iconName || 'fa-folder') }),
                React.createElement('span', null, sec.title),
                sec.badge && React.createElement('span', { className: 'fui-badge' }, sec.badge)
              )
            )
          ),
          React.createElement('div', { style: { marginTop: '1.25rem' } },
            React.createElement('div', { className: 'fui-grid', style: gridInlineStyle },
              filterBlocks(activeSection.blocks).map((block, bIdx) => {
                const effectiveHeightMode = (block.heightMode && block.heightMode !== 'default') ? block.heightMode : (state.cardHeightMode || 'auto');
                const isAutoHeight = effectiveHeightMode === 'auto';
                const cardSpanStyle = {
                  gridColumn: block.colSpan && block.colSpan > 1 ? `span ${block.colSpan}` : undefined,
                  gridRow: block.rowSpan && block.rowSpan > 1 ? `span ${block.rowSpan}` : undefined,
                  alignSelf: isAutoHeight ? 'start' : 'stretch',
                  height: isAutoHeight ? 'auto' : '100%'
                };
                return block.type === 'metric' ?
                React.createElement('div', { key: block.id, className: 'fui-card', style: cardSpanStyle },
                  React.createElement('div', null,
                    React.createElement('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center' } },
                      React.createElement('span', { style: { fontSize: '0.85rem', fontWeight: 600, color: 'var(--fui-colorNeutralForeground3)' } }, block.title),
                      isEditMode ? React.createElement('span', { className: 'fui-badge', style: { cursor: 'pointer' }, onClick: () => { selectCardSection(state.activeSecIdx); selectCard(bIdx); setPanePage(3); } }, '✏️ Edit') : null
                    ),
                    React.createElement('div', { className: 'fui-metric-value' }, block.metricValue),
                    React.createElement('div', { className: 'fui-metric-trend' },
                      React.createElement('span', { className: 'fui-badge fui-badge-success' },
                        React.createElement('i', { className: 'fa-solid fa-arrow-trend-up', style: { marginRight: '4px' } }),
                        block.metricTrend
                      )
                    ),
                    React.createElement('p', { className: 'fui-card-desc' }, block.description),
                    block.termStoreTags && React.createElement('div', { className: 'fui-card-tags', style: { marginTop: '8px' } },
                      block.termStoreTags.map(t => React.createElement('span', { key: t.id, className: 'fui-tag', style: { borderColor: 'var(--fui-colorBrandStroke1)', color: 'var(--fui-colorBrandForeground1)' } }, '🏷️ ' + t.label))
                    )
                  )
                ) :
                React.createElement('div', { key: block.id, className: 'fui-card', style: cardSpanStyle },
                  React.createElement('div', null,
                    React.createElement('div', { className: 'fui-card-header' },
                      React.createElement('div', { className: 'fui-icon-box' },
                        React.createElement('i', { className: 'fa-solid ' + (block.iconName || 'fa-file-lines') })
                      ),
                      React.createElement('div', { style: { display: 'flex', gap: '6px', alignItems: 'center' } },
                        block.badge && React.createElement('span', { className: 'fui-badge' }, block.badge),
                        isEditMode ? React.createElement('span', { className: 'fui-badge', style: { cursor: 'pointer' }, onClick: () => { selectCardSection(state.activeSecIdx); selectCard(bIdx); setPanePage(3); } }, '✏️ Edit') : null
                      )
                    ),
                    React.createElement('h3', { className: 'fui-card-title' }, block.title),
                    React.createElement('p', { className: 'fui-card-desc' }, block.description),
                    block.termStoreTags ? React.createElement('div', { className: 'fui-card-tags', style: { marginTop: '8px' } },
                      block.termStoreTags.map(t => React.createElement('span', { key: t.id, className: 'fui-tag', style: { borderColor: 'var(--fui-colorBrandStroke1)', color: 'var(--fui-colorBrandForeground1)' } }, '🏷️ ' + t.label))
                    ) : (
                      block.tags && React.createElement('div', { className: 'fui-card-tags' },
                        block.tags.map(t => React.createElement('span', { key: t, className: 'fui-tag' }, t))
                      )
                    )
                  ),
                  React.createElement('a', { href: block.actionUrl || '#', className: 'fui-btn-subtle' },
                    block.actionText || 'Open',
                    React.createElement('i', { className: 'fa-solid fa-arrow-up-right-from-square' })
                  )
                );
              })
            )
          )
        ) :

        // Accordion View
        React.createElement('div', null,
          currentSections.map(sec => 
            React.createElement('div', { key: sec.id, className: 'fui-accordion-item' },
              React.createElement('button', { className: 'fui-accordion-header' },
                React.createElement('div', { style: { display: 'flex', alignItems: 'center', gap: '0.75rem' } },
                  React.createElement('i', { className: 'fa-solid ' + (sec.iconName || 'fa-folder'), style: { color: 'var(--fui-colorBrandForeground1)' } }),
                  React.createElement('span', { style: { fontWeight: 600 } }, sec.title)
                ),
                React.createElement('div', { style: { display: 'flex', alignItems: 'center', gap: '0.75rem' } },
                  sec.badge && React.createElement('span', { className: 'fui-badge' }, sec.badge),
                  React.createElement('i', { className: 'fa-solid fa-chevron-down' })
                )
              ),
              React.createElement('div', { className: 'fui-accordion-panel' },
                React.createElement('div', { className: 'fui-grid', style: gridInlineStyle },
                  filterBlocks(sec.blocks).map((block, bIdx) => {
                    const effectiveHeightMode = (block.heightMode && block.heightMode !== 'default') ? block.heightMode : (state.cardHeightMode || 'auto');
                    const isAutoHeight = effectiveHeightMode === 'auto';
                    const cardSpanStyle = {
                      gridColumn: block.colSpan && block.colSpan > 1 ? `span ${block.colSpan}` : undefined,
                      gridRow: block.rowSpan && block.rowSpan > 1 ? `span ${block.rowSpan}` : undefined,
                      alignSelf: isAutoHeight ? 'start' : 'stretch',
                      height: isAutoHeight ? 'auto' : '100%'
                    };
                    return block.type === 'metric' ?
                    React.createElement('div', { key: block.id, className: 'fui-card', style: cardSpanStyle },
                      React.createElement('div', null,
                        React.createElement('span', { style: { fontSize: '0.85rem', fontWeight: 600, color: 'var(--fui-colorNeutralForeground3)' } }, block.title),
                        React.createElement('div', { className: 'fui-metric-value' }, block.metricValue),
                        React.createElement('div', { className: 'fui-metric-trend' },
                          React.createElement('span', { className: 'fui-badge fui-badge-success' }, block.metricTrend)
                        ),
                        React.createElement('p', { className: 'fui-card-desc' }, block.description)
                      )
                    ) :
                    React.createElement('div', { key: block.id, className: 'fui-card', style: cardSpanStyle },
                      React.createElement('div', null,
                        React.createElement('div', { className: 'fui-card-header' },
                          React.createElement('div', { className: 'fui-icon-box' },
                            React.createElement('i', { className: 'fa-solid ' + (block.iconName || 'fa-file-lines') })
                          ),
                          block.badge && React.createElement('span', { className: 'fui-badge' }, block.badge)
                        ),
                        React.createElement('h3', { className: 'fui-card-title' }, block.title),
                        React.createElement('p', { className: 'fui-card-desc' }, block.description)
                      )
                    );
                  })
                )
              )
            )
          )
        )
      );
    }

    function render() {
      ReactDOM.render(React.createElement(App), document.getElementById('spfx-root'));
    }

    syncSidebar();
    render();
  </script>
</body>
</html>
