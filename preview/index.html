<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SharePoint Full-Width Container — Fluent UI 2 & Property Sidebar</title>
  <!-- React 17 & ReactDOM -->
  <script src="https://unpkg.com/react@17.0.2/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@17.0.2/umd/react-dom.development.js" crossorigin></script>
  <!-- FontAwesome for fallback preview icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  
  <style>
    :root {
      --fui-colorNeutralBackground1: #ffffff;
      --fui-colorNeutralBackground2: #fafafa;
      --fui-colorNeutralBackground3: #f5f5f5;
      --fui-colorNeutralBackground4: #ebebeb;
      --fui-colorNeutralForeground1: #242424;
      --fui-colorNeutralForeground2: #424242;
      --fui-colorNeutralForeground3: #616161;
      --fui-colorNeutralForeground4: #8a8a8a;
      --fui-colorNeutralStroke1: #d1d1d1;
      --fui-colorNeutralStroke2: #e0e0e0;
      --fui-colorBrandBackground: #0078d4;
      --fui-colorBrandBackgroundHover: #106ebe;
      --fui-colorBrandBackground2: #eff6fc;
      --fui-colorBrandForeground1: #0078d4;
      --fui-colorBrandForeground2: #106ebe;
      --fui-colorBrandStroke1: #0078d4;
      --fui-colorBrandStroke2: #c7e0f4;
      --fui-colorSuccessBackground1: #dff6dd;
      --fui-colorSuccessForeground1: #107c10;
      --fui-borderRadiusSmall: 4px;
      --fui-borderRadiusMedium: 6px;
      --fui-borderRadiusLarge: 8px;
      --fui-borderRadiusCircular: 9999px;
      --fui-shadow4: 0 0 2px rgba(0, 0, 0, 0.12), 0 2px 4px rgba(0, 0, 0, 0.14);
      --fui-shadow8: 0 0 2px rgba(0, 0, 0, 0.12), 0 4px 8px rgba(0, 0, 0, 0.14);
      --fui-shadow16: 0 0 2px rgba(0, 0, 0, 0.14), 0 8px 16px rgba(0, 0, 0, 0.14);
      --fui-shadow28: 0 0 8px rgba(0, 0, 0, 0.12), 0 14px 28px rgba(0, 0, 0, 0.18);
      --fui-fontFamily: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
    }

    .dark-mode {
      --fui-colorNeutralBackground1: #1f1f1f;
      --fui-colorNeutralBackground2: #141414;
      --fui-colorNeutralBackground3: #292929;
      --fui-colorNeutralBackground4: #333333;
      --fui-colorNeutralForeground1: #ffffff;
      --fui-colorNeutralForeground2: #d6d6d6;
      --fui-colorNeutralForeground3: #adadad;
      --fui-colorNeutralForeground4: #808080;
      --fui-colorNeutralStroke1: #424242;
      --fui-colorNeutralStroke2: #333333;
      --fui-colorBrandBackground: #2886de;
      --fui-colorBrandBackgroundHover: #3aa0f3;
      --fui-colorBrandBackground2: #1a2733;
      --fui-colorBrandForeground1: #479ef5;
      --fui-colorBrandForeground2: #62abf5;
      --fui-colorBrandStroke1: #2886de;
      --fui-colorBrandStroke2: #1f496e;
      --fui-colorSuccessBackground1: #0f3b14;
      --fui-colorSuccessForeground1: #54b054;
      --fui-shadow4: 0 0 2px rgba(0, 0, 0, 0.28), 0 2px 4px rgba(0, 0, 0, 0.32);
      --fui-shadow8: 0 0 2px rgba(0, 0, 0, 0.28), 0 4px 8px rgba(0, 0, 0, 0.32);
      --fui-shadow16: 0 0 2px rgba(0, 0, 0, 0.35), 0 8px 16px rgba(0, 0, 0, 0.35);
      --fui-shadow28: 0 0 8px rgba(0, 0, 0, 0.35), 0 14px 28px rgba(0, 0, 0, 0.45);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--fui-fontFamily);
      background-color: var(--fui-colorNeutralBackground2);
      color: var(--fui-colorNeutralForeground1);
      min-height: 100vh;
      overflow-x: hidden;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    /* Top SharePoint Nav Header */
    .sp-header {
      background-color: var(--fui-colorNeutralBackground1);
      border-bottom: 1px solid var(--fui-colorNeutralStroke2);
      padding: 0.75rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: var(--fui-shadow4);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .sp-btn {
      background-color: var(--fui-colorBrandBackground);
      color: #fff;
      border: none;
      padding: 0.45rem 1rem;
      border-radius: var(--fui-borderRadiusMedium);
      font-family: var(--fui-fontFamily);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: opacity 0.15s ease;
    }
    .sp-btn:hover { opacity: 0.9; }

    .sp-btn-secondary {
      background-color: var(--fui-colorNeutralBackground3);
      color: var(--fui-colorNeutralForeground1);
      border: 1px solid var(--fui-colorNeutralStroke1);
    }

    /* Main Workspace & Sidebar */
    .main-workspace {
      display: flex;
      width: 100%;
      min-height: calc(100vh - 60px);
      position: relative;
    }

    .page-canvas {
      flex: 1;
      min-width: 0;
      padding: 1.5rem;
      transition: margin-right 0.25s ease;
    }

    .sp-property-pane {
      width: 370px;
      background-color: var(--fui-colorNeutralBackground1);
      border-left: 1px solid var(--fui-colorNeutralStroke1);
      box-shadow: var(--fui-shadow16);
      display: flex;
      flex-direction: column;
      height: calc(100vh - 60px);
      position: sticky;
      top: 60px;
      overflow-y: auto;
      z-index: 90;
      transition: transform 0.25s ease;
    }

    .pane-header {
      padding: 1.25rem 1rem 0.75rem 1rem;
      border-bottom: 1px solid var(--fui-colorNeutralStroke2);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .pane-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--fui-colorNeutralForeground1);
    }

    .pane-desc {
      font-size: 0.8rem;
      color: var(--fui-colorNeutralForeground3);
      margin-top: 0.2rem;
    }

    .pane-nav {
      display: flex;
      border-bottom: 1px solid var(--fui-colorNeutralStroke2);
      background-color: var(--fui-colorNeutralBackground3);
    }

    .pane-nav-tab {
      flex: 1;
      padding: 0.6rem 0.5rem;
      border: none;
      background: transparent;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--fui-colorNeutralForeground2);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      text-align: center;
    }

    .pane-nav-tab.active {
      background-color: var(--fui-colorNeutralBackground1);
      color: var(--fui-colorBrandForeground1);
      border-bottom-color: var(--fui-colorBrandBackground);
    }

    .pane-body {
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .form-label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--fui-colorNeutralForeground2);
    }

    .form-input, .form-select, .form-textarea {
      background-color: var(--fui-colorNeutralBackground1);
      border: 1px solid var(--fui-colorNeutralStroke1);
      border-radius: var(--fui-borderRadiusSmall);
      padding: 0.45rem 0.6rem;
      font-family: var(--fui-fontFamily);
      font-size: 0.85rem;
      color: var(--fui-colorNeutralForeground1);
      outline: none;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus {
      border-color: var(--fui-colorBrandBackground);
    }

    /* Container Web Part Styles */
    .fui-root {
      width: 100%;
      padding: 2rem;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      transition: background 250ms, border-color 250ms, box-shadow 250ms;
      border-radius: var(--fui-borderRadiusLarge);
    }

    .fui-root.style-standard {
      background-color: var(--fui-colorNeutralBackground2);
      border: 1px solid var(--fui-colorNeutralStroke2);
    }

    .fui-root.style-glassmorphism {
      background-color: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
    }
    body.dark-mode .fui-root.style-glassmorphism {
      background-color: rgba(24, 24, 24, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .fui-root.style-branded {
      background-color: var(--fui-colorBrandBackground2);
      border: 1px solid var(--fui-colorBrandStroke2);
    }

    .fui-root.style-minimal {
      background-color: transparent;
      border: none;
      box-shadow: none;
    }

    .fui-root.style-gradient {
      background: linear-gradient(135deg, rgba(0, 120, 212, 0.08) 0%, rgba(255, 255, 255, 0.95) 100%);
      border: 1px solid var(--fui-colorNeutralStroke2);
    }

    .edit-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.6rem 1rem;
      background-color: var(--fui-colorBrandBackground2);
      border: 1px dashed var(--fui-colorBrandStroke1);
      border-radius: var(--fui-borderRadiusMedium);
      font-size: 0.85rem;
      gap: 1rem;
    }

    .fui-header {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      justify-content: space-between;
    }
    @media (min-width: 768px) {
      .fui-header {
        flex-direction: row;
        align-items: flex-end;
      }
    }

    .fui-controls {
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .fui-input-box {
      position: relative;
      display: flex;
      align-items: center;
    }

    .fui-input {
      background-color: var(--fui-colorNeutralBackground1);
      border: 1px solid var(--fui-colorNeutralStroke1);
      border-bottom: 2px solid var(--fui-colorNeutralStroke1);
      border-radius: var(--fui-borderRadiusMedium);
      padding: 0.45rem 0.75rem 0.45rem 2rem;
      color: var(--fui-colorNeutralForeground1);
      font-family: var(--fui-fontFamily);
      font-size: 0.9rem;
      outline: none;
      min-width: 220px;
    }
    .fui-input:focus { border-bottom-color: var(--fui-colorBrandBackground); }

    .fui-input-icon {
      position: absolute;
      left: 0.65rem;
      color: var(--fui-colorNeutralForeground3);
      font-size: 0.85rem;
      pointer-events: none;
    }

    .fui-mode-tabs {
      display: flex;
      background-color: var(--fui-colorNeutralBackground3);
      border-radius: var(--fui-borderRadiusMedium);
      padding: 2px;
    }

    .fui-mode-tab {
      background: transparent;
      border: none;
      padding: 0.35rem 0.75rem;
      border-radius: var(--fui-borderRadiusSmall);
      color: var(--fui-colorNeutralForeground2);
      font-family: var(--fui-fontFamily);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.15s ease;
    }
    .fui-mode-tab.active {
      background-color: var(--fui-colorNeutralBackground1);
      color: var(--fui-colorBrandForeground1);
      box-shadow: var(--fui-shadow4);
    }

    .fui-tablist {
      display: flex;
      gap: 0.5rem;
      border-bottom: 1px solid var(--fui-colorNeutralStroke2);
      padding-bottom: 0.25rem;
      overflow-x: auto;
    }

    .fui-tab {
      background: transparent;
      border: none;
      border-bottom: 3px solid transparent;
      padding: 0.6rem 1rem;
      color: var(--fui-colorNeutralForeground2);
      font-family: var(--fui-fontFamily);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      white-space: nowrap;
      transition: all 0.15s ease;
    }
    .fui-tab:hover { color: var(--fui-colorNeutralForeground1); }
    .fui-tab.active {
      color: var(--fui-colorBrandForeground1);
      border-bottom-color: var(--fui-colorBrandBackground);
    }

    .fui-badge {
      background-color: var(--fui-colorBrandBackground2);
      color: var(--fui-colorBrandForeground1);
      padding: 2px 8px;
      border-radius: var(--fui-borderRadiusSmall);
      font-size: 0.75rem;
      font-weight: 600;
      white-space: nowrap;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
    }
    .fui-badge-success {
      background-color: var(--fui-colorSuccessBackground1);
      color: var(--fui-colorSuccessForeground1);
    }

    .fui-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.25rem;
      width: 100%;
    }

    .fui-card {
      background-color: var(--fui-colorNeutralBackground1);
      border: 1px solid var(--fui-colorNeutralStroke1);
      border-radius: var(--fui-borderRadiusLarge);
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: var(--fui-shadow4);
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      position: relative;
    }
    .fui-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--fui-shadow8);
      border-color: var(--fui-colorBrandStroke1);
    }

    .fui-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.75rem;
    }

    .fui-icon-box {
      width: 40px;
      height: 40px;
      border-radius: var(--fui-borderRadiusMedium);
      background-color: var(--fui-colorBrandBackground2);
      color: var(--fui-colorBrandForeground1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
    }

    .fui-metric-value {
      font-size: 2rem;
      font-weight: 700;
      color: var(--fui-colorBrandForeground1);
      line-height: 2.25rem;
      margin: 0.5rem 0 0.25rem 0;
    }

    .fui-card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin-top: 0.75rem;
    }

    .fui-tag {
      background-color: var(--fui-colorNeutralBackground2);
      border: 1px solid var(--fui-colorNeutralStroke1);
      color: var(--fui-colorNeutralForeground2);
      font-size: 0.75rem;
      padding: 2px 6px;
      border-radius: var(--fui-borderRadiusSmall);
    }

    .fui-btn-subtle {
      background: transparent;
      border: none;
      color: var(--fui-colorBrandForeground1);
      font-family: var(--fui-fontFamily);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.35rem 0;
      margin-top: 1rem;
    }
    .fui-btn-subtle:hover { text-decoration: underline; }

    /* Accordion styles */
    .fui-accordion-item {
      background-color: var(--fui-colorNeutralBackground1);
      border: 1px solid var(--fui-colorNeutralStroke1);
      border-radius: var(--fui-borderRadiusMedium);
      margin-bottom: 0.75rem;
      overflow: hidden;
    }

    .fui-accordion-header {
      width: 100%;
      padding: 1rem 1.25rem;
      background: transparent;
      border: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      font-family: var(--fui-fontFamily);
      font-size: 1rem;
      color: var(--fui-colorNeutralForeground1);
    }

    .fui-accordion-panel {
      padding: 0 1.25rem 1.25rem 1.25rem;
      border-top: 1px solid var(--fui-colorNeutralStroke2);
    }

    /* WYSIWYG Editable Text Element Styling */
    .fui-editable {
      outline: none;
      transition: background-color 0.15s ease, border-color 0.15s ease;
      border-radius: 4px;
      padding: 2px 4px;
    }
    .fui-editable:hover {
      background-color: var(--fui-colorBrandBackground2);
    }
    .fui-editable:focus {
      background-color: var(--fui-colorNeutralBackground1);
      box-shadow: 0 0 0 1.5px var(--fui-colorBrandStroke1);
    }

    /* Floating Formatting Toolbar */
    .fui-floating-toolbar {
      position: absolute;
      top: -46px;
      left: 0;
      z-index: 200;
      background-color: var(--fui-colorNeutralBackground1);
      border: 1px solid var(--fui-colorNeutralStroke1);
      border-radius: var(--fui-borderRadiusMedium);
      box-shadow: var(--fui-shadow16);
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 4px 6px;
      user-select: none;
    }

    .fui-toolbar-btn {
      background: transparent;
      border: none;
      width: 26px;
      height: 26px;
      border-radius: 4px;
      color: var(--fui-colorNeutralForeground1);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
    }
    .fui-toolbar-btn:hover {
      background-color: var(--fui-colorNeutralBackground3);
      color: var(--fui-colorBrandForeground1);
    }

    /* Icon Picker Modal */
    .fui-modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(2px);
      z-index: 500;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .fui-modal-surface {
      background-color: var(--fui-colorNeutralBackground1);
      border-radius: var(--fui-borderRadiusLarge);
      box-shadow: var(--fui-shadow28);
      width: 650px;
      max-width: 92vw;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid var(--fui-colorNeutralStroke1);
    }

    .fui-modal-header {
      padding: 1rem 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--fui-colorNeutralStroke2);
    }

    .fui-modal-body {
      padding: 1.25rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .fui-icon-grid-picker {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(95px, 1fr));
      gap: 0.5rem;
      max-height: 320px;
      overflow-y: auto;
      padding: 4px;
    }

    .fui-icon-grid-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0.6rem 0.4rem;
      border: 1px solid var(--fui-colorNeutralStroke2);
      border-radius: var(--fui-borderRadiusMedium);
      background-color: var(--fui-colorNeutralBackground1);
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
    }
    .fui-icon-grid-item:hover {
      transform: translateY(-2px);
      border-color: var(--fui-colorBrandStroke1);
      background-color: var(--fui-colorNeutralBackground2);
      box-shadow: var(--fui-shadow4);
    }
    .fui-icon-grid-item.active {
      background-color: var(--fui-colorBrandBackground2);
      border-color: var(--fui-colorBrandStroke1);
      box-shadow: var(--fui-shadow4);
    }

    .fui-color-palette-popover {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      padding: 8px;
      background: var(--fui-colorNeutralBackground1);
      border: 1px solid var(--fui-colorNeutralStroke1);
      border-radius: 6px;
      box-shadow: var(--fui-shadow16);
      position: absolute;
      top: 34px;
      left: 0;
      z-index: 300;
    }
    .fui-color-dot {
      width: 20px;
      height: 20px;
      border-radius: 4px;
      border: 1px solid rgba(0,0,0,0.15);
      cursor: pointer;
      transition: transform 0.1s ease;
    }
    .fui-color-dot:hover { transform: scale(1.2); }
  </style>
</head>
<body>
  <!-- SharePoint Shell Navigation -->
  <header class="sp-header">
    <div style="display: flex; align-items: center; gap: 1rem;">
      <i class="fa-solid fa-shapes" style="color: var(--fui-colorBrandForeground1); font-size: 1.4rem;"></i>
      <span style="font-size: 1.1rem; font-weight: 700;">Contoso Intranet • Full-Width Container</span>
    </div>
    <div style="display: flex; align-items: center; gap: 0.75rem;">
      <button class="sp-btn sp-btn-secondary" onclick="toggleTheme()" title="Toggle Dark/Light Mode">
        <i class="fa-solid fa-circle-half-stroke"></i> Theme
      </button>
      <button class="sp-btn" onclick="toggleEditMode()" id="btn-edit-mode">
        <i class="fa-solid fa-pen-to-square"></i> <span id="edit-mode-label">Exit Edit</span>
      </button>
    </div>
  </header>

  <div class="main-workspace">
    <!-- Page Canvas -->
    <main class="page-canvas">
      <div id="spfx-root"></div>
    </main>

    <!-- Properties Sidebar Simulation -->
    <div class="sp-property-pane" id="property-pane">
      <div class="pane-header">
        <div>
          <div class="pane-title">Container properties</div>
          <div class="pane-desc">Full-width section configuration</div>
        </div>
        <button class="fui-btn-subtle" onclick="toggleSidebar()"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <!-- 3-Page Navigation -->
      <div class="pane-nav">
        <button class="pane-nav-tab active" id="tab-p1" onclick="setPanePage(1)">1. Layout</button>
        <button class="pane-nav-tab" id="tab-p2" onclick="setPanePage(2)">2. Sections</button>

        const filtered = intranetTerms.filter(t => {
          const matchesCat = activeTermCategory === 'all' || t.termSetName.toLowerCase() === activeTermCategory.toLowerCase();

          if (!termSearchQuery.trim()) return true;
          const q = termSearchQuery.toLowerCase().trim();
          return t.label.toLowerCase().includes(q) || (t.path && t.path.toLowerCase().includes(q));
        });

        if (filtered.length === 0) {
          container.innerHTML = `
            <div style="padding: 6px; color: var(--fui-colorNeutralForeground4); font-size: 0.78rem; text-align: center;">

          return;

        filtered.forEach(term => {
          const isSelected = selectedTags.some(st => st.id === term.id || st.label.toLowerCase() === term.label.toLowerCase());

          item.style.alignItems = 'center';

          });

            const effectiveMaxCols = Math.max(1, state.gridCols > 0 ? state.gridCols : 4);

            const selColSpan = document.getElementById('sel-card-colspan');

            if (selColSpan) {
              selColSpan.innerHTML = '';
              for (let c = 1; c <= effectiveMaxCols; c++) {
                const opt = document.createElement('option');
                opt.value = c;
                opt.textContent = c === 1 ? '1 col (standard)' : (c === effectiveMaxCols ? `Span ${c} cols (full)` : `Span ${c} cols`);

              }
              const clampedCol = Math.min(curCard.colSpan || 1, effectiveMaxCols);
              curCard.colSpan = clampedCol;
              selColSpan.value = clampedCol;
            }
            if (lblColSpan) lblColSpan.textContent = `Column span (max ${effectiveMaxCols})`;

              const clampedRow = Math.min(curCard.rowSpan || 1, effectiveMaxRows);
              curCard.rowSpan = clampedRow;
              selRowSpan.value = clampedRow;

            if (lblRowSpan) lblRowSpan.textContent = `Row span (max ${effectiveMaxRows})`;
