<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SharePoint Full-Width Container — Fluent UI 2</title>
  <!-- React 17 & ReactDOM -->
  <script src="https://unpkg.com/react@17.0.2/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@17.0.2/umd/react-dom.development.js" crossorigin></script>
  <!-- FontAwesome for preview icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  
  <style>
    :root {
      /* Fluent 2 Design Tokens (Light Theme) */
      --fui-colorNeutralBackground1: #ffffff;
      --fui-colorNeutralBackground2: #fafafa;
      --fui-colorNeutralBackground3: #f5f5f5;
      --fui-colorNeutralForeground1: #242424;
      --fui-colorNeutralForeground2: #424242;
      --fui-colorNeutralForeground3: #616161;
      --fui-colorNeutralStroke1: #d1d1d1;
      --fui-colorNeutralStroke2: #e0e0e0;
      --fui-colorBrandBackground: #0078d4;
      --fui-colorBrandBackgroundHover: #106ebe;
      --fui-colorBrandBackground2: #eff6fc;
      --fui-colorBrandForeground1: #0078d4;
      --fui-colorBrandForeground2: #106ebe;
      --fui-colorBrandStroke1: #0078d4;
      --fui-colorSuccessBackground1: #dff6dd;
      --fui-colorSuccessForeground1: #107c10;
      --fui-borderRadiusSmall: 4px;
      --fui-borderRadiusMedium: 6px;
      --fui-borderRadiusLarge: 8px;
      --fui-borderRadiusCircular: 9999px;
      --fui-shadow4: 0 0 2px rgba(0, 0, 0, 0.12), 0 2px 4px rgba(0, 0, 0, 0.14);
      --fui-shadow8: 0 0 2px rgba(0, 0, 0, 0.12), 0 4px 8px rgba(0, 0, 0, 0.14);
      --fui-fontFamily: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
    }

    .dark-mode {
      --fui-colorNeutralBackground1: #1f1f1f;
      --fui-colorNeutralBackground2: #141414;
      --fui-colorNeutralBackground3: #292929;
      --fui-colorNeutralForeground1: #ffffff;
      --fui-colorNeutralForeground2: #d6d6d6;
      --fui-colorNeutralForeground3: #adadad;
      --fui-colorNeutralStroke1: #424242;
      --fui-colorNeutralStroke2: #333333;
      --fui-colorBrandBackground: #2886de;
      --fui-colorBrandBackgroundHover: #3aa0f3;
      --fui-colorBrandBackground2: #1a2733;
      --fui-colorBrandForeground1: #479ef5;
      --fui-colorBrandForeground2: #62abf5;
      --fui-colorBrandStroke1: #2886de;
      --fui-colorSuccessBackground1: #0f3b14;
      --fui-colorSuccessForeground1: #54b054;
      --fui-shadow4: 0 0 2px rgba(0, 0, 0, 0.28), 0 2px 4px rgba(0, 0, 0, 0.32);
      --fui-shadow8: 0 0 2px rgba(0, 0, 0, 0.28), 0 4px 8px rgba(0, 0, 0, 0.32);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--fui-fontFamily);
      background-color: var(--fui-colorNeutralBackground2);
      color: var(--fui-colorNeutralForeground1);
      min-height: 100vh;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .sp-header {
      background-color: var(--fui-colorNeutralBackground1);
      border-bottom: 1px solid var(--fui-colorNeutralStroke2);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: var(--fui-shadow4);
    }

    .sp-badge {
      background-color: var(--fui-colorBrandBackground2);
      color: var(--fui-colorBrandForeground1);
      border: 1px solid var(--fui-colorBrandStroke1);
      padding: 4px 10px;
      border-radius: var(--fui-borderRadiusCircular);
      font-size: 0.8rem;
      font-weight: 600;
    }

    /* FULL WIDTH CONTAINER (Full Bleed) */
    .sp-full-bleed-container {
      width: 100%;
      background-color: var(--fui-colorNeutralBackground2);
      box-sizing: border-box;
    }

    .fui-root {
      width: 100%;
      padding: 2rem;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    /* Fluent 2 Header */
    .fui-header {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      justify-content: space-between;
    }

    @media (min-width: 768px) {
      .fui-header {
        flex-direction: row;
        align-items: flex-end;
      }
    }

    .fui-title {
      font-size: 1.75rem;
      font-weight: 700;
      line-height: 2.25rem;
      color: var(--fui-colorNeutralForeground1);
    }

    .fui-subtitle {
      font-size: 0.95rem;
      color: var(--fui-colorNeutralForeground3);
      margin-top: 0.25rem;
    }

    .fui-controls {
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    /* Fluent 2 Input */
    .fui-input-box {
      position: relative;
      display: flex;
      align-items: center;
    }

    .fui-input {
      background-color: var(--fui-colorNeutralBackground1);
      border: 1px solid var(--fui-colorNeutralStroke1);
      border-bottom: 2px solid var(--fui-colorNeutralStroke1);
      border-radius: var(--fui-borderRadiusMedium);
      padding: 0.45rem 0.75rem 0.45rem 2rem;
      color: var(--fui-colorNeutralForeground1);
      font-family: var(--fui-fontFamily);
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.15s ease;
      min-width: 220px;
    }

    .fui-input:focus {
      border-bottom-color: var(--fui-colorBrandBackground);
    }

    .fui-input-icon {
      position: absolute;
      left: 0.65rem;
      color: var(--fui-colorNeutralForeground3);
      font-size: 0.85rem;
      pointer-events: none;
    }

    /* Fluent 2 Mode Switcher TabList */
    .fui-mode-tabs {
      display: flex;
      background-color: var(--fui-colorNeutralBackground3);
      border-radius: var(--fui-borderRadiusMedium);
      padding: 2px;
    }

    .fui-mode-tab {
      background: transparent;
      border: none;
      padding: 0.35rem 0.75rem;
      border-radius: var(--fui-borderRadiusSmall);
      color: var(--fui-colorNeutralForeground2);
      font-family: var(--fui-fontFamily);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.15s ease;
    }

    .fui-mode-tab.active {
      background-color: var(--fui-colorNeutralBackground1);
      color: var(--fui-colorBrandForeground1);
      box-shadow: var(--fui-shadow4);
    }

    /* Fluent 2 Navigation TabList */
    .fui-tablist {
      display: flex;
      gap: 0.5rem;
      border-bottom: 1px solid var(--fui-colorNeutralStroke2);
      padding-bottom: 0.25rem;
      overflow-x: auto;
    }

    .fui-tab {
      background: transparent;
      border: none;
      border-bottom: 3px solid transparent;
      padding: 0.6rem 1rem;
      color: var(--fui-colorNeutralForeground2);
      font-family: var(--fui-fontFamily);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .fui-tab:hover {
      color: var(--fui-colorNeutralForeground1);
    }

    .fui-tab.active {
      color: var(--fui-colorBrandForeground1);
      border-bottom-color: var(--fui-colorBrandBackground);
    }

    /* Fluent 2 Card Grid */
    .fui-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.25rem;
      width: 100%;
    }

    /* Fluent 2 Card Component */
    .fui-card {
      background-color: var(--fui-colorNeutralBackground1);
      border: 1px solid var(--fui-colorNeutralStroke1);
      border-radius: var(--fui-borderRadiusLarge);
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: var(--fui-shadow4);
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .fui-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--fui-shadow8);
      border-color: var(--fui-colorBrandStroke1);
    }

    .fui-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.75rem;
    }

    .fui-icon-box {
      width: 36px;
      height: 36px;
      border-radius: var(--fui-borderRadiusMedium);
      background-color: var(--fui-colorBrandBackground2);
      color: var(--fui-colorBrandForeground1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
    }

    /* Fluent 2 Badge */
    .fui-badge {
      background-color: var(--fui-colorBrandBackground2);
      color: var(--fui-colorBrandForeground1);
      padding: 2px 8px;
      border-radius: var(--fui-borderRadiusSmall);
      font-size: 0.75rem;
      font-weight: 600;
    }

    .fui-badge-success {
      background-color: var(--fui-colorSuccessBackground1);
      color: var(--fui-colorSuccessForeground1);
    }

    .fui-card-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--fui-colorNeutralForeground1);
      margin-bottom: 0.4rem;
    }

    .fui-card-desc {
      font-size: 0.9rem;
      color: var(--fui-colorNeutralForeground2);
      line-height: 1.45;
      margin-bottom: 1rem;
    }

    .fui-card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin-bottom: 1rem;
    }

    .fui-tag {
      background-color: var(--fui-colorNeutralBackground3);
      border: 1px solid var(--fui-colorNeutralStroke2);
      color: var(--fui-colorNeutralForeground2);
      padding: 2px 6px;
      border-radius: var(--fui-borderRadiusSmall);
      font-size: 0.75rem;
    }

    /* Fluent 2 Button */
    .fui-btn-subtle {
      background: transparent;
      border: none;
      color: var(--fui-colorBrandForeground1);
      font-family: var(--fui-fontFamily);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      text-decoration: none;
      padding: 0.4rem 0.6rem;
      border-radius: var(--fui-borderRadiusMedium);
      transition: background-color 0.15s ease;
      align-self: flex-start;
    }

    .fui-btn-subtle:hover {
      background-color: var(--fui-colorNeutralBackground3);
    }

    /* Fluent 2 Metric Card (£) */
    .fui-metric-value {
      font-size: 2rem;
      font-weight: 700;
      color: var(--fui-colorBrandForeground1);
      margin: 0.4rem 0 0.2rem 0;
      line-height: 2.25rem;
    }

    .fui-metric-trend {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      margin-bottom: 0.75rem;
    }

    /* Fluent 2 Accordion Component */
    .fui-accordion-item {
      background-color: var(--fui-colorNeutralBackground1);
      border: 1px solid var(--fui-colorNeutralStroke1);
      border-radius: var(--fui-borderRadiusMedium);
      margin-bottom: 0.5rem;
      overflow: hidden;
    }

    .fui-accordion-header {
      width: 100%;
      padding: 0.9rem 1.25rem;
      background: transparent;
      border: none;
      color: var(--fui-colorNeutralForeground1);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--fui-fontFamily);
      text-align: left;
    }

    .fui-accordion-header:hover {
      background-color: var(--fui-colorNeutralBackground3);
    }

    .fui-accordion-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .fui-accordion-panel {
      padding: 1.25rem;
      border-top: 1px solid var(--fui-colorNeutralStroke2);
      background-color: var(--fui-colorNeutralBackground2);
    }

    .fui-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--fui-colorNeutralStroke2);
      margin-bottom: 1rem;
      color: var(--fui-colorNeutralForeground3);
      font-size: 0.85rem;
    }

    .theme-toggle-btn {
      background: transparent;
      border: 1px solid var(--fui-colorNeutralStroke1);
      border-radius: var(--fui-borderRadiusMedium);
      padding: 0.4rem 0.75rem;
      color: var(--fui-colorNeutralForeground1);
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
  </style>
</head>
<body>

  <!-- SharePoint Site Header Simulation -->
  <div class="sp-header">
    <div style="display: flex; align-items: center; gap: 1rem;">
      <i class="fa-solid fa-shapes" style="font-size: 1.5rem; color: var(--fui-colorBrandBackground);"></i>
      <div>
        <h2 style="font-size: 1.15rem; font-weight: 600;">SharePoint Online — Modern Communication Site</h2>
        <p style="font-size: 0.85rem; color: var(--fui-colorNeutralForeground3);">Fluent UI 2 (@fluentui/react-components) Full-Width Section</p>
      </div>
    </div>
    <div style="display: flex; gap: 0.75rem; align-items: center;">
      <button class="theme-toggle-btn" id="btn-theme-toggle" onclick="toggleTheme()">
        <i class="fa-solid fa-circle-half-stroke"></i>
        <span>Toggle Theme</span>
      </button>
      <span class="sp-badge">Fluent 2 Active</span>
    </div>
  </div>

  <!-- Full Width SharePoint Section -->
  <div class="sp-full-bleed-container">
    <div id="spfx-root"></div>
  </div>

  <script>
    function toggleTheme() {
      document.body.classList.toggle('dark-mode');
    }

    const defaultSections = [
      {
        id: 'sec-playbooks',
        title: 'Playbooks & Guidance',
        iconName: 'fa-book-open',
        badge: 'Core',
        description: 'Centralised operational methodologies, service line playbooks, and best practice frameworks.',
        blocks: [
          {
            id: 'blk-1',
            type: 'card',
            title: 'Commercial Advisory Playbook',
            description: 'Standardized delivery lifecycle, contract governance, and commercial risk matrices.',
            badge: 'P1 Mandatory',
            iconName: 'fa-file-lines',
            tags: ['Commercial', 'Advisory', 'P0'],
            actionText: 'Open Playbook',
            actionUrl: '#'
          },
          {
            id: 'blk-2',
            type: 'metric',
            title: 'Q1 Programme Expenditure',
            description: 'Total approved commercial capital burn-down in current quarter.',
            metricValue: '£1,420,000',
            metricTrend: '+6.2% vs baseline',
            tags: ['Budget', 'GBP', 'Finance']
          },
          {
            id: 'blk-3',
            type: 'card',
            title: 'Project Assurance Checklist',
            description: 'Mandatory gateway reviews, milestone verification, and stakeholder sign-off criteria.',
            badge: 'Compliance',
            iconName: 'fa-circle-check',
            tags: ['Assurance', 'Quality'],
            actionText: 'View Checklist',
            actionUrl: '#'
          }
        ]
      },
      {
        id: 'sec-metrics',
        title: 'Programme Metrics (£)',
        iconName: 'fa-chart-simple',
        badge: 'Real-time',
        description: 'Executive overview of programme financials, budget burn-down, and delivery milestones in GBP (£).',
        blocks: [
          {
            id: 'blk-m1',
            type: 'metric',
            title: 'Total Portfolio Budget',
            metricValue: '£42,850,000',
            metricTrend: '+3.2% vs Q2 forecast',
            description: 'Approved capital allocation across active commissions in GBP',
            tags: ['Portfolio', 'GBP', 'Capital']
          },
          {
            id: 'blk-m2',
            type: 'metric',
            title: 'Efficiency Savings Realised',
            metricValue: '£3,420,000',
            metricTrend: '+18.4% ahead of target',
            description: 'Value engineering and procurement optimization savings',
            tags: ['Savings', 'GBP', 'Efficiency']
          },
          {
            id: 'blk-m3',
            type: 'metric',
            title: 'Commissions on Schedule',
            metricValue: '94.8%',
            metricTrend: '+1.5% from last period',
            description: 'Critical path milestone tracking across 48 projects',
            tags: ['SLA', 'Milestone']
          }
        ]
      },
      {
        id: 'sec-embeds',
        title: 'Live Tools & Portals',
        iconName: 'fa-window-restore',
        badge: 'Interactive',
        description: 'Integrated live data feeds, external calculators, and interactive dashboards.',
        blocks: [
          {
            id: 'blk-e1',
            type: 'card',
            title: 'Cost Estimation Calculator',
            description: 'Real-time NRM1/NRM2 benchmarking model with automated inflation indices.',
            badge: 'Tool',
            iconName: 'fa-calculator',
            tags: ['Cost', 'NRM', 'Live'],
            actionText: 'Open Calculator',
            actionUrl: '#'
          },
          {
            id: 'blk-e2',
            type: 'card',
            title: 'Power BI Performance Feed',
            description: 'Interactive analytics dashboard embedded directly within the container.',
            badge: 'Power BI',
            iconName: 'fa-chart-pie',
            tags: ['Reporting', 'Power BI'],
            actionText: 'Launch Dashboard',
            actionUrl: '#'
          }
        ]
      }
    ];

    function App() {
      const [layoutMode, setLayoutMode] = React.useState('tabs');
      const [activeTabId, setActiveTabId] = React.useState('sec-playbooks');
      const [searchQuery, setSearchQuery] = React.useState('');
      const [openAccordionIds, setOpenAccordionIds] = React.useState({ 'sec-playbooks': true });

      const toggleAccordion = (id) => {
        setOpenAccordionIds(prev => ({ ...prev, [id]: !prev[id] }));
      };

      const expandAll = () => {
        const all = {};
        defaultSections.forEach(s => all[s.id] = true);
        setOpenAccordionIds(all);
      };

      const collapseAll = () => {
        setOpenAccordionIds({});
      };

      const activeSection = defaultSections.find(s => s.id === activeTabId) || defaultSections[0];

      const filterBlocks = (blocks) => {
        if (!searchQuery.trim()) return blocks;
        const q = searchQuery.toLowerCase().trim();
        return blocks.filter(b => 
          b.title.toLowerCase().includes(q) ||
          (b.description && b.description.toLowerCase().includes(q)) ||
          (b.badge && b.badge.toLowerCase().includes(q)) ||
          (b.tags && b.tags.some(t => t.toLowerCase().includes(q)))
        );
      };

      return React.createElement('div', { className: 'fui-root' },
        // Header
        React.createElement('div', { className: 'fui-header' },
          React.createElement('div', null,
            React.createElement('h1', { className: 'fui-title' }, 'Interactive Content Hub'),
            React.createElement('p', { className: 'fui-subtitle' }, 'Built entirely using Microsoft Fluent UI 2 (@fluentui/react-components) with native SharePoint theme inheritance')
          ),
          React.createElement('div', { className: 'fui-controls' },
            // Fluent 2 Input
            React.createElement('div', { className: 'fui-input-box' },
              React.createElement('i', { className: 'fa-solid fa-magnifying-glass fui-input-icon' }),
              React.createElement('input', {
                type: 'text',
                className: 'fui-input',
                placeholder: 'Filter items, tags, GBP...',
                value: searchQuery,
                onChange: (e) => setSearchQuery(e.target.value)
              })
            ),
            // Fluent 2 Layout Switcher
            React.createElement('div', { className: 'fui-mode-tabs' },
              React.createElement('button', {
                id: 'btn-mode-tabs',
                className: 'fui-mode-tab ' + (layoutMode === 'tabs' ? 'active' : ''),
                onClick: () => setLayoutMode('tabs')
              }, React.createElement('i', { className: 'fa-solid fa-folder' }), 'Tabs'),
              React.createElement('button', {
                id: 'btn-mode-accordion',
                className: 'fui-mode-tab ' + (layoutMode === 'accordion' ? 'active' : ''),
                onClick: () => setLayoutMode('accordion')
              }, React.createElement('i', { className: 'fa-solid fa-list' }), 'Accordion')
            )
          )
        ),

        // Tabs View
        layoutMode === 'tabs' ? React.createElement('div', null,
          React.createElement('div', { className: 'fui-tablist', role: 'tablist' },
            defaultSections.map(sec => 
              React.createElement('button', {
                key: sec.id,
                id: 'tab-' + sec.id,
                className: 'fui-tab ' + (sec.id === activeTabId ? 'active' : ''),
                onClick: () => setActiveTabId(sec.id),
                role: 'tab',
                'aria-selected': sec.id === activeTabId
              },
                React.createElement('i', { className: 'fa-solid ' + sec.iconName }),
                React.createElement('span', null, sec.title),
                sec.badge && React.createElement('span', { className: 'fui-badge' }, sec.badge)
              )
            )
          ),
          React.createElement('div', { style: { marginTop: '1.25rem' } },
            React.createElement('div', { className: 'fui-grid' },
              filterBlocks(activeSection.blocks).map(block => 
                block.type === 'metric' ?
                React.createElement('div', { key: block.id, className: 'fui-card' },
                  React.createElement('div', null,
                    React.createElement('span', { style: { fontSize: '0.85rem', fontWeight: 600, color: 'var(--fui-colorNeutralForeground3)' } }, block.title),
                    React.createElement('div', { className: 'fui-metric-value' }, block.metricValue),
                    React.createElement('div', { className: 'fui-metric-trend' },
                      React.createElement('span', { className: 'fui-badge fui-badge-success' },
                        React.createElement('i', { className: 'fa-solid fa-arrow-trend-up', style: { marginRight: '4px' } }),
                        block.metricTrend
                      )
                    ),
                    React.createElement('p', { className: 'fui-card-desc' }, block.description)
                  )
                ) :
                React.createElement('div', { key: block.id, className: 'fui-card' },
                  React.createElement('div', null,
                    React.createElement('div', { className: 'fui-card-header' },
                      React.createElement('div', { className: 'fui-icon-box' },
                        React.createElement('i', { className: 'fa-solid ' + block.iconName })
                      ),
                      block.badge && React.createElement('span', { className: 'fui-badge' }, block.badge)
                    ),
                    React.createElement('h3', { className: 'fui-card-title' }, block.title),
                    React.createElement('p', { className: 'fui-card-desc' }, block.description),
                    block.tags && React.createElement('div', { className: 'fui-card-tags' },
                      block.tags.map(t => React.createElement('span', { key: t, className: 'fui-tag' }, t))
                    )
                  ),
                  React.createElement('a', { href: block.actionUrl, className: 'fui-btn-subtle' },
                    block.actionText,
                    React.createElement('i', { className: 'fa-solid fa-arrow-up-right-from-square' })
                  )
                )
              )
            )
          )
        ) :

        // Accordion View
        React.createElement('div', null,
          React.createElement('div', { className: 'fui-toolbar' },
            React.createElement('span', null, defaultSections.length + ' Sections'),
            React.createElement('div', { style: { display: 'flex', gap: '0.5rem' } },
              React.createElement('button', { className: 'fui-btn-subtle', onClick: expandAll },
                React.createElement('i', { className: 'fa-solid fa-angles-down' }), ' Expand All'
              ),
              React.createElement('button', { className: 'fui-btn-subtle', onClick: collapseAll },
                React.createElement('i', { className: 'fa-solid fa-angles-up' }), ' Collapse All'
              )
            )
          ),
          defaultSections.map(sec => {
            const isOpen = !!openAccordionIds[sec.id];
            const blocks = filterBlocks(sec.blocks);
            return React.createElement('div', { key: sec.id, className: 'fui-accordion-item' },
              React.createElement('button', {
                className: 'fui-accordion-header',
                onClick: () => toggleAccordion(sec.id)
              },
                React.createElement('div', { className: 'fui-accordion-left' },
                  React.createElement('i', { className: 'fa-solid ' + sec.iconName, style: { color: 'var(--fui-colorBrandForeground1)' } }),
                  React.createElement('span', { style: { fontWeight: 600 } }, sec.title)
                ),
                React.createElement('div', { style: { display: 'flex', alignItems: 'center', gap: '0.75rem' } },
                  sec.badge && React.createElement('span', { className: 'fui-badge' }, sec.badge),
                  React.createElement('i', {
                    className: 'fa-solid fa-chevron-down',
                    style: { transform: isOpen ? 'rotate(180deg)' : 'none', transition: 'transform 0.2s ease' }
                  })
                )
              ),
              isOpen && React.createElement('div', { className: 'fui-accordion-panel' },
                React.createElement('div', { className: 'fui-grid' },
                  blocks.map(block => 
                    block.type === 'metric' ?
                    React.createElement('div', { key: block.id, className: 'fui-card' },
                      React.createElement('div', null,
                        React.createElement('span', { style: { fontSize: '0.85rem', fontWeight: 600, color: 'var(--fui-colorNeutralForeground3)' } }, block.title),
                        React.createElement('div', { className: 'fui-metric-value' }, block.metricValue),
                        React.createElement('div', { className: 'fui-metric-trend' },
                          React.createElement('span', { className: 'fui-badge fui-badge-success' },
                            React.createElement('i', { className: 'fa-solid fa-arrow-trend-up', style: { marginRight: '4px' } }),
                            block.metricTrend
                          )
                        ),
                        React.createElement('p', { className: 'fui-card-desc' }, block.description)
                      )
                    ) :
                    React.createElement('div', { key: block.id, className: 'fui-card' },
                      React.createElement('div', null,
                        React.createElement('div', { className: 'fui-card-header' },
                          React.createElement('div', { className: 'fui-icon-box' },
                            React.createElement('i', { className: 'fa-solid ' + block.iconName })
                          ),
                          block.badge && React.createElement('span', { className: 'fui-badge' }, block.badge)
                        ),
                        React.createElement('h3', { className: 'fui-card-title' }, block.title),
                        React.createElement('p', { className: 'fui-card-desc' }, block.description),
                        block.tags && React.createElement('div', { className: 'fui-card-tags' },
                          block.tags.map(t => React.createElement('span', { key: t, className: 'fui-tag' }, t))
                        )
                      ),
                      React.createElement('a', { href: block.actionUrl, className: 'fui-btn-subtle' },
                        block.actionText,
                        React.createElement('i', { className: 'fa-solid fa-arrow-up-right-from-square' })
                      )
                    )
                  )
                )
              )
            );
          })
        )
      );
    }

    ReactDOM.render(React.createElement(App), document.getElementById('spfx-root'));
  </script>
</body>
</html>
